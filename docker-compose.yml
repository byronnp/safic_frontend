# SAFIC · Frontend en desarrollo.
# Requiere el backend levantado (repositorio safic_backend): ese compose crea la red "safic"
# y el servicio "api", al que el servidor de Vite reenvía /api.
services:
  web:
    build:
      context: .
      target: dev
    ports: ['9000:9000']
    # Valores del archivo .env (ver .env.example); si falta, se usan estos por defecto.
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:8080}
      SAFIC_WATCH_POLLING: ${SAFIC_WATCH_POLLING:-true}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    restart: unless-stopped

  # Versión de producción local (nginx): docker compose --profile prod up --build web-prod
  web-prod:
    profiles: ['prod']
    build:
      context: .
      target: prod
    ports: ['8081:8080']

volumes:
  node_modules:

networks:
  default:
    name: safic
    external: true
